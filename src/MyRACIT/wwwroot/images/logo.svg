<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- I — left vertical bar -->
  <rect x="18" y="22" width="12" height="56" rx="6" ry="6" fill="rgba(255,255,255,0.35)"/>
  <!-- T — top horizontal bar -->
  <rect x="36" y="22" width="46" height="12" rx="6" ry="6" fill="white"/>
  <!-- T — vertical stem -->
  <rect x="53" y="34" width="12" height="44" rx="6" ry="6" fill="white"/>
</svg>
