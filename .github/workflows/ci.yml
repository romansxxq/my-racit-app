name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore my-racit-app.slnx

      - name: Build (перевірка компіляції)
        run: dotnet build my-racit-app.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/MyRACIT.Tests/MyRACIT.Tests.csproj --no-restore --configuration Release --verbosity normal
