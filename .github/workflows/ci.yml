name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore my-racit-app.slnx

      - name: Build (перевірка компіляції)
        run: dotnet build my-racit-app.slnx --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test tests/MyRACIT.Tests/MyRACIT.Tests.csproj --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Write coverage summary to job summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        if: always()
